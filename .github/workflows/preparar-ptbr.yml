name: Preparar bestiário em português
on:
  push:
    branches: [main]
    paths:
      - scripts/traduzir_bestiario.py
      - data/nomes-pt-BR.json
      - .github/workflows/preparar-ptbr.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  traducao-estatica:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Instalar mecanismo de tradução offline
        run: pip install 'argostranslate>=1.9,<2'
      - name: Gerar todos os textos em PT-BR ANTES da publicação
        run: python scripts/traduzir_bestiario.py
        env:
          ARGOS_DEVICE_TYPE: cpu
      - name: Validar estrutura do bestiário traduzido
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/monsters.pt-BR.json'))
          assert p['_locale']=='pt-BR'
          assert len(p['monsters'])==322
          assert all(m.get('locale')=='pt-BR' and m.get('name') for m in p['monsters'])
          print('Bestriário português validado:',len(p['monsters']),'fichas')
          PY
      - name: Gravar arquivo PT-BR no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monsters.pt-BR.json data/auditoria-pt-BR.json
          if ! git diff --cached --quiet; then
            git commit -m "i18n: disponibilizar 322 fichas do SRD em português brasileiro"
            git push origin HEAD:main
          fi
