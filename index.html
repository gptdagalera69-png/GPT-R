<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1420">
<meta name="description" content="Atlas Arcano do Mestre. Bestiário, encontros, iniciativa e combate em uma só mesa.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/theme-v2.css">
<link rel="stylesheet" href="/atlas-v3.css"><link rel="stylesheet" href="/mestre-v35.css"><link rel="stylesheet" href="/monster-art-v1.css">
<title>Central do Mestre — Atlas Arcano</title>
</head>
<body>
<button id="navBackdrop" class="nav-backdrop" data-action="toggle-menu" type="button" aria-label="Fechar navegação" hidden></button>
<div id="app">
<aside class="sidebar atlas-sidebar" id="sideNav" aria-label="Navegação do mestre">
 <div class="sidebar-gilding" aria-hidden="true"></div>
 <div class="brand atlas-brand">
   <img class="atlas-emblem" src="/assets/atlas-logo.svg" alt="Brasão da Central do Mestre">
   <div class="brand-copy"><strong>CENTRAL<br><span>DO MESTRE</span></strong><small>SEU GRIMÓRIO DE MESA</small></div>
   <button class="sidebar-close" type="button" data-action="toggle-menu" aria-label="Fechar menu">×</button>
 </div>
 <div class="nav-caption">SEU SALÃO DE COMANDO</div>
 <nav id="sidebarNav" class="atlas-nav" aria-label="Áreas da Central">
  <button data-view="dashboard" class="nav-link active"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#home"></use></svg><span>Visão geral</span></button>
  <button data-view="bestiary" class="nav-link"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#beast"></use></svg><span>Bestiário</span><i id="countMonsters">322</i></button>
  <button data-view="builder" class="nav-link"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#swords"></use></svg><span>Criador de encontros</span></button>
  <button data-view="combat" class="nav-link"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#dice"></use></svg><span>Mesa de combate</span></button>
  <button data-view="campaigns" class="nav-link"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#book"></use></svg><span>Campanhas</span></button>
 </nav>
 <div class="nav-caption extra">SISTEMA</div>
 <button data-view="settings" class="nav-link nav-setting"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#gear"></use></svg><span>Configurações</span></button>
 <div class="sidebar-bottom">
  <div class="atlas-decor" aria-hidden="true">✦</div>
  <div class="connection"><span id="connectionLight" class="dot"></span><div><strong id="connectionText">Salvo neste dispositivo</strong><small id="connectionHint">Nuvem ainda não configurada</small></div></div>
  <button class="guild-profile" type="button" data-view="settings" title="Conta e sincronização">
   <span class="guild-avatar">M</span><span><strong>Mestre</strong><small>Central de comando</small></span><span class="guild-arrow">›</span>
  </button>
 </div>
</aside>
<div class="shell">
 <header class="topbar atlas-topbar">
  <div class="topbar-left">
   <button type="button" class="menu-toggle" data-action="toggle-menu" aria-label="Abrir menu"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#home"></use></svg></button>
   <button type="button" class="home-crumb" data-view="dashboard" aria-label="Ir para a visão geral"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#home"></use></svg></button>
   <span class="top-separator" aria-hidden="true"></span>
   <div class="crumb">CENTRAL DO MESTRE <span>›</span> <b id="currentCrumb">Visão geral</b></div>
  </div>
  <div class="head-right">
   <form id="globalSearchForm" class="global-search" role="search" aria-label="Buscar criaturas">
    <button type="submit" aria-label="Pesquisar criatura"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#search"></use></svg></button>
    <input id="globalSearch" type="search" autocomplete="off" aria-label="Buscar criatura no Bestiário" placeholder="Buscar criaturas..." maxlength="110">
    <span class="shortcut" aria-hidden="true">Ctrl K</span>
   </form>
   <button data-view="builder" class="quick-encounter" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#swords"></use></svg><span>Novo encontro</span></button>
   <button class="userbubble" data-view="settings" type="button" aria-label="Abrir configurações">M</button>
  </div>
 </header>
 <main id="view" class="content"><div class="loading">Abrindo o grimório...</div></main>
</div>
</div>
<nav class="mobile-nav" aria-label="Navegação móvel">
<button data-view="dashboard"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#home"></use></svg><span>Início</span></button>
<button data-view="bestiary"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#beast"></use></svg><span>Bestiário</span></button>
<button data-view="builder"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#swords"></use></svg><span>Encontros</span></button>
<button data-view="combat"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#dice"></use></svg><span>Combate</span></button>
<button data-action="toggle-menu"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/atlas-icons.svg#gear"></use></svg><span>Mais</span></button>
</nav>
<div id="modalRoot"></div><div id="toastRoot" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
